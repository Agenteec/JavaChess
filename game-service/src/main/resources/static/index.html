<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ChessSphere - Играть</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" integrity="sha384-q94+BZtLrkL1/ohfjR8c6L+A6qzNH9R2hBLwyoAfu3i/WCvQjzL2RQJ3uNHDISdU" crossorigin="anonymous">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2f2f2f;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        .container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            max-width: 1000px;
            width: 100%;
        }
        #board {
            width: 500px;
        }
        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #3f3f3f;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #chat {
            height: 250px;
            border: 1px solid #555;
            background: #1e1e1e;
            padding: 10px;
            overflow-y: auto;
            border-radius: 4px;
            font-size: 14px;
        }
        .chat-msg { margin-bottom: 8px; }
        .chat-sender { color: #f0d9b5; font-weight: bold; }
        input, button {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #555;
            color: white;
            font-size: 14px;
        }
        button {
            background-color: #007bff;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        .status { font-weight: bold; font-size: 18px; color: #f0d9b5; }
    </style>
</head>
<body>

<h1>Онлайн Шахматы — ChessSphere</h1>

<div style="display: flex; gap: 10px; margin-bottom: 10px;">
    <input type="text" id="usernameInput" placeholder="Ваше имя" value="player1">
    <input type="text" id="roomInput" placeholder="ID Комнаты (например, room1)" value="room1">
    <button id="connectBtn" onclick="connect()">Подключиться к игре</button>
</div>

<div class="status" id="gameStatus">Ожидание подключения...</div>

<div class="container">
    <div id="board"></div>

    <div class="panel">
        <h3>Чат партии</h3>
        <div id="chat"></div>
        <div style="display: flex; gap: 5px;">
            <input type="text" id="chatInput" placeholder="Введите сообщение..." style="flex: 1;" onkeypress="handleChatKey(event)">
            <button onclick="sendChatMessage()">Отправить</button>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha384-ZvpUoO/+PpLXR1lu4jmpXWu80pZlYUAfxl5NsBMWOEPSjUn/6Z/hRTt8+pR6L4N2" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js" integrity="sha384-8Vi8VHwn3vjQ9eUHUxex3JSN/NFqUg3QbPyX8kWyb93+8AC/pPWTzj+nHtbC5bxD" crossorigin="anonymous"></script>
<script>
    let socket = null;
    let board = null;
    let gameId = '';
    let username = '';


    const config = {
        draggable: true,
        position: 'start',
        onDrop: handleMove,

        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    };

    board = Chessboard('board', config);

    function connect() {
        username = document.getElementById('usernameInput').value;
        gameId = document.getElementById('roomInput').value;

        if (!username || !gameId) {
            alert("Введите имя и ID комнаты!");
            return;
        }

        socket = new WebSocket("ws://localhost:8082/game");

        socket.onopen = () => {
            document.getElementById('gameStatus').innerText = `Подключено к комнате: ${gameId}`;
            document.getElementById('connectBtn').disabled = true;

            const joinMsg = {
                action: "JOIN",
                gameId: gameId,
                username: username
            };
            socket.send(JSON.stringify(joinMsg));
        };

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === "STATE") {

                board.position(data.fen);

                let statusText = `Ход: ${data.turn === 'WHITE' ? 'Белых' : 'Черных'}`;
                if (data.mated) statusText += " — МАТ!";
                if (data.draw) statusText += " — НИЧЬЯ!";
                document.getElementById('gameStatus').innerText = statusText;
            }
            else if (data.type === "CHAT") {
                appendChat(data.sender, data.message);
            }
            else if (data.type === "ERROR") {
                alert("Ошибка от сервера: " + data.message);
                socket.send(JSON.stringify({ action: "JOIN", gameId: gameId }));
            }
        };

        socket.onclose = () => {
            document.getElementById('gameStatus').innerText = "Соединение разорвано";
            document.getElementById('connectBtn').disabled = false;
        };
    }


    function handleMove(source, target, piece, newPos, oldPos, orientation) {
        if (source === target) return;

        const moveMsg = {
            action: "MOVE",
            gameId: gameId,
            username: username,
            from: source,
            to: target
        };

        socket.send(JSON.stringify(moveMsg));
    }

    function sendChatMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text || !socket) return;

        const chatMsg = {
            action: "CHAT",
            gameId: gameId,
            username: username,
            message: text
        };

        socket.send(JSON.stringify(chatMsg));
        input.value = '';
    }

    function handleChatKey(event) {
        if (event.key === 'Enter') {
            sendChatMessage();
        }
    }

    function appendChat(sender, message) {
        const chatDiv = document.getElementById('chat');
        const msgHtml = `<div class="chat-msg"><span class="chat-sender">${sender}:</span> ${message}</div>`;
        chatDiv.innerHTML += msgHtml;
        chatDiv.scrollTop = chatDiv.scrollHeight; // Скролл вниз
    }
</script>
</body>
</html>
