server.port=8082
spring.application.name=game-service

spring.data.redis.host=localhost
spring.data.redis.port=6379

jwt.secret=${JWT_SECRET:my_temporary_local_development_secret_key_which_is_at_least_32_bytes_long}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.user-service.internal-url=${USER_SERVICE_INTERNAL_URL:http://localhost:8081}

app.internal.secret=${INTERNAL_SECRET:}