version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: chess-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - chess-network

  redis:
    image: redis:8.8-alpine
    container_name: chess-redis
    networks:
      - chess-network

  mailserver:
    image: bytemark/smtp
    container_name: chess-mailserver
    restart: always
    networks:
      - chess-network

  user-service:
    build:
      context: ./user-service
    container_name: chess-user-service
    depends_on:
      - postgres
      - mailserver
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - TURNSTILE_SECRET=${TURNSTILE_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - SPRING_MAIL_HOST=mailserver
      - SPRING_MAIL_PORT=25
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=false
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=false
      - APP_USER_SERVICE_BASE_URL=${APP_BASE_URL}
    networks:
      - chess-network

  game-service:
    build:
      context: ./game-service
    container_name: chess-game-service
    depends_on:
      - redis
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - USER_SERVICE_INTERNAL_URL=http://user-service:8081
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    networks:
      - chess-network

  nginx:
    image: nginx:alpine
    container_name: chess-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - user-service
      - game-service
    networks:
      - chess-network

networks:
  chess-network:
    driver: bridge

volumes:
  postgres_data: