server.port=8081
spring.application.name=user-service

spring.datasource.url=jdbc:postgresql://localhost:5432/chess_users
spring.datasource.username=postgres
spring.datasource.password=postgres_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:my_temporary_local_development_secret_key_which_is_at_least_32_bytes_long}

app.turnstile.secret=${TURNSTILE_SECRET:}

spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:default_mailtrap_user}
spring.mail.password=${MAIL_PASSWORD:default_mailtrap_password}
app.user-service.base-url=${USER_SERVICE_URL:http://localhost:8081}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true